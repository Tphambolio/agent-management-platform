services:
  # Backend API
  - type: web
    name: agent-platform-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      # NOTE: DATABASE_URL must be set manually in Render dashboard
      # after service creation. Point to existing agent-management-db.
      - key: AGENTS_DIR
        value: /opt/render/project/src/.agents
      - key: CORS_ORIGINS
        value: https://agent-platform-frontend.onrender.com,http://localhost:5173

  # Frontend Static Site
  - type: web
    name: agent-platform-frontend
    env: static
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://agent-platform-backend-3g16.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Note: Using existing agent-management-db database (renamed from wildfire-db)
# Shared with wildfire simulator - each app has separate tables
